server:
  port: 8080

spring:
  datasource:
    # A file-backed database keeps browser verification data across restarts.
    # The path is relative to 前端/java/business, the documented launch directory.
    url: jdbc:h2:file:../../runtime/h2/pdf_to_word;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

file:
  # Resolve to the repository's shared frontend data and build directories.
  root: ../../image
  frontend: ../../dist

logging:
  level:
    com.haitang.pdf2word: INFO
